const D = {};

D.overview = () => `<div>
<div class="overview-grid">
  <div class="metric-card red"><div class="num">8</div><div class="lbl">Critical ESCs</div></div>
  <div class="metric-card amber"><div class="num">5</div><div class="lbl">High severity</div></div>
  <div class="metric-card blue"><div class="num">1</div><div class="lbl">Medium severity</div></div>
</div>
<div class="info-box"><i class="ti ti-bulb" aria-hidden="true" style="font-size:15px;flex-shrink:0;margin-top:1px"></i><div>Start with <span class="inline-code">certipy find -vulnerable</span> on every engagement. Then read the Prerequisites and "What is a .pfx?" pages before diving into individual ESCs.</div></div>
<div class="section-title"><i class="ti ti-shield-exclamation" aria-hidden="true"></i>All ESC vulnerabilities — click any to open</div>
<div class="esc-grid">
${[
  ['esc1','ESC1','SAN abuse','critical','Enrollee-supplied SAN lets any user impersonate any other including DA'],
  ['esc2','ESC2','Any purpose EKU','critical','Certificate valid for any purpose — chain to ESC1 or ESC3'],
  ['esc3','ESC3','Enrollment agent','critical','Two-template chain: get EA cert, then enroll on behalf of DA'],
  ['esc4','ESC4','Template write perms','critical','Modify any template to introduce ESC1/ESC2 then exploit'],
  ['esc6','ESC6','EDITF_ATTRIBUTESUBJECTALTNAME2','critical','CA-wide flag: every template becomes ESC1-vulnerable'],
  ['esc7','ESC7','CA officer rights','critical','ManageCA → grant self Officer → approve/forge certs for any user'],
  ['esc8','ESC8','NTLM relay HTTP','critical','Relay coerced DC auth to certsrv → get DC cert → DCSync'],
  ['esc13','ESC13','OID group link','critical','Template OID linked to privileged group — cert = DA membership'],
  ['esc5','ESC5','PKI object ACLs','high','Write to NTAuthCertificates or CA object = domain-wide trust abuse'],
  ['esc9','ESC9','No security extension','high','UPN collision attack via userPrincipalName modification'],
  ['esc10','ESC10','Weak cert mapping','high','Registry keys allow SAN/UPN-based auth bypass'],
  ['esc11','ESC11','RPC relay','high','Same as ESC8 but targets RPC/DCOM endpoint — survives ESC8 mitigations'],
  ['esc15','ESC15','Schema v1 EKU bypass','high','Schema v1 templates accept requester-supplied Application Policies'],
  ['esc12','ESC12','CSP/HSM key exposure','medium','CA private key accessible on host → offline cert forging']
].map(([k,id,name,sev,desc])=>`<div class="esc-card ${sev}" onclick="showEsc('${k}')"><div class="esc-id">${id}</div><div class="esc-name">${name}</div><div class="esc-desc">${desc}</div></div>`).join('')}
